# EXAMPLE ONLY — do not commit real secrets.
# In production, manage this Secret via AWS Secrets Manager + External Secrets Operator
# (or SOPS / sealed-secrets). The keys below match what the api Deployment expects.
apiVersion: v1
kind: Secret
metadata:
  name: api-secrets
type: Opaque
stringData:
  # postgresql+psycopg://user:pass@rds-host:5432/local_bazaar
  DATABASE_URL: "REPLACE_ME"
  # Server-side Google Maps key — restrict by IP/API in GCP console.
  GOOGLE_MAPS_API_KEY: "REPLACE_ME"
