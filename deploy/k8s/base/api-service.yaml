apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: local-bazaar
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      # Match the container port (and the docker-compose default) so the same
      # API_INTERNAL_URL=http://api:8000 works in both environments. The Next.js
      # standalone build bakes this URL into the routes manifest at build time;
      # keeping the port consistent avoids needing per-env builds.
      port: 8000
      targetPort: http
