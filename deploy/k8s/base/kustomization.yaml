apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: local-bazaar

commonLabels:
  app.kubernetes.io/part-of: local-bazaar

resources:
  - namespace.yaml
  - configmaps.yaml
  - api-deployment.yaml
  - api-service.yaml
  - web-deployment.yaml
  - web-service.yaml
  - ingress.yaml
  - scrape-cronjob.yaml
  # Note: api-secrets is NOT included here on purpose. Overlays or ExternalSecrets
  # must provide it. See secrets.example.yaml for the expected shape.
