apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: local-bazaar
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/part-of: local-bazaar
    spec:
      containers:
        - name: web
          image: local-bazaar/web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: API_INTERNAL_URL
              valueFrom:
                configMapKeyRef:
                  name: web-config
                  key: API_INTERNAL_URL
            - name: NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
              valueFrom:
                configMapKeyRef:
                  name: web-config
                  key: NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
