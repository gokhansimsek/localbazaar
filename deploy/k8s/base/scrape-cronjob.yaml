# Daily scrape, runs at 02:00 Europe/Istanbul (= 23:00 UTC previous day).
# In-cluster scheduler is disabled (SCRAPER_DISABLE_SCHEDULER=1 on api Deployment),
# so this CronJob is the canonical daily trigger.
#
# `python -m local_bazaar.scheduler` runs run_daily_scrape() once and exits:
# national bulletin + every per-city scraper + the markets crawl. Geocoding is
# NOT triggered here (it spends Google Maps quota) — run scripts/geocode_markets.py
# on demand instead.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: scrape-daily
  labels:
    app.kubernetes.io/name: scrape-daily
    app.kubernetes.io/part-of: local-bazaar
spec:
  schedule: "0 23 * * *"
  timeZone: "UTC"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      # Full scrape = national + 9 city scrapers + markets crawl (~30–60 min on its own).
      # 2 h leaves headroom; a cold first run that backfills a year may need more.
      activeDeadlineSeconds: 7200
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: scrape
              image: local-bazaar/api:latest
              command:
                - python
                - -m
                - local_bazaar.scheduler
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: api-secrets
                      key: DATABASE_URL
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  # The Antalya scraper drives headless Chromium (Playwright),
                  # which alone can use 300–500Mi — 512Mi risks an OOMKill.
                  memory: 1Gi
